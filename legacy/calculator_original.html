<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Умный зайчик — математика</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(135deg,#fff5eb,#e6f6ff);font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;padding:70px 10px 24px;color:#543c4b}.rabbit{position:relative;background:#ffd8e7;border:6px solid #f7b9d1;border-radius:42% 42% 34px 34px / 15% 15% 34px 34px;padding:67px 17px 22px;width:min(96vw,440px);box-shadow:0 16px 35px #9b627344}.ear{position:absolute;top:-67px;width:72px;height:104px;background:#ff9251;border-radius:50% 50% 18% 18%;z-index:-1}.ear.left{left:65px}.ear.right{right:65px}.eyes{position:absolute;top:19px;left:0;right:0;display:flex;justify-content:center;gap:75px}.eye{width:35px;height:24px;border-radius:50%;background:#ffe8f1;border:3px solid #f5b9cf}.screen{background:#e0f2e7;border:5px solid white;border-radius:14px;min-height:132px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px;text-align:center;margin-bottom:13px;color:#244f47;box-shadow:inset 0 2px 8px #547b7755}.main{font-size:clamp(26px,7vw,36px);font-weight:800;overflow-wrap:anywhere}.hint{font-size:14px;min-height:23px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.settings label{font-size:12px;font-weight:700}.settings select{display:block;width:100%;padding:8px 4px;margin-top:3px;border:2px solid #efb0c9;border-radius:10px;background:white;color:#543c4b;font-size:14px}.stats{text-align:center;font-size:13px;font-weight:750;margin:9px 0}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.btn{border:0;cursor:pointer;font-weight:800;touch-action:manipulation}.action{background:#ff8d4d;color:white;border-radius:12px;font-size:13px;min-height:53px;box-shadow:0 4px 0 #c45b2b;padding:3px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.num{background:#70d2ee;color:white;border-radius:50%;aspect-ratio:1;font-size:32px;text-shadow:0 2px 2px #277d99;box-shadow:0 5px 0 #397e99}.bottom{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;margin-top:19px}.bottom button{background:#ff8d4d;color:white;border:0;border-radius:15px;font-size:28px;font-weight:850;min-height:65px;box-shadow:0 5px 0 #c45b2b;cursor:pointer}.bottom .ok{border-radius:45px}.btn:active,.bottom button:active{transform:translateY(3px);box-shadow:none}.status{text-align:center;min-height:35px;font-size:13px;margin-top:12px;line-height:1.4}.extra{display:flex;gap:8px;justify-content:center;margin-top:12px}.extra button{border:2px solid #f2b5cf;background:#fff7fb;border-radius:10px;padding:8px 12px;color:#6d4357;font-weight:700;cursor:pointer}.extra button:disabled{opacity:.4}.foot{text-align:center;font-size:11px;color:#8b6a7a;margin-top:12px}@media(max-width:365px){.rabbit{padding-left:11px;padding-right:11px}.grid{gap:7px}.num{font-size:28px}.actions{gap:4px}.action{font-size:11px}}
</style></head><body><main class="rabbit"><div class="ear left"></div><div class="ear right"></div><div class="eyes"><div class="eye"></div><div class="eye"></div><div class="screen" aria-live="polite"><div class="hint" id="hint">Привет! Готов к математике? 🐰</div><div class="main" id="display">0</div></div><div class="settings"><label>Возраст<select id="age"><option value="3">3–4 года</option><option value="5">5–6 лет</option><option value="7">7–8 лет</option><option value="9">9–12 лет</option></select></label><label>Сложность<select id="difficulty"><option value="1">⭐ Легко</option><option value="2">⭐⭐ Средне</option><option value="3">⭐⭐⭐ Сложно</option></select></label></div><div class="stats" id="stats">⭐ 0 · Верно: 0/0</div><div class="actions"><button class="btn action" id="game">🎮 Игра</button><button class="btn action" data-op="+">＋</button><button class="btn action" data-op="−">−</button><button class="btn action" data-op="×">×</button><button class="btn action" data-op="÷">÷</button></div><div class="grid"><button class="btn num" data-n="1">1</button><button class="btn num" data-n="2">2</button><button class="btn num" data-n="3">3</button><button class="btn num" id="plus">＋</button><button class="btn num" data-n="4">4</button><button class="btn num" data-n="5">5</button><button class="btn num" data-n="6">6</button><button class="btn num" id="minus">−</button><button class="btn num" data-n="7">7</button><button class="btn num" data-n="8">8</button><button class="btn num" data-n="9">9</button><button class="btn num" data-n="0">0</button></div><div class="bottom"><button id="equals">=</button><button class="ok" id="ok">OK</button><button id="clear">⌫</button></div><div class="extra"><button id="help">💡 Подсказка</button><button id="sound">🔊 Звук</button><button id="reset">↺ Сброс</button></div><div class="status" id="status">Нажми «🎮 Игра», чтобы начать задания</div><div class="foot">Работает без интернета · достижения на этом устройстве</div></main><script>
'use strict';const $=id=>document.getElementById(id),ages=['3','5','7','9'];let age=ages.includes(localStorage.getItem('rabbit-age'))?localStorage.getItem('rabbit-age'):'9',difficulty=Number(localStorage.getItem('rabbit-difficulty'))||1,playing=false,input='',first=null,op='+',answer=0,task=null,locked=false,sound=true,timer=null;const saved=JSON.parse(localStorage.getItem('rabbit-progress-v2')||'{}');let progress=(saved[age]&&saved[age][difficulty])||{stars:0,correct:0,total:0};function store(){saved[age]??={};saved[age][difficulty]=progress;localStorage.setItem('rabbit-progress-v2',JSON.stringify(saved))}function refresh(){progress=(saved[age]&&saved[age][difficulty])||{stars:0,correct:0,total:0};$('stats').textContent=`⭐ ${progress.stars} · Верно: ${progress.correct}/${progress.total}`;$('difficulty').value=String(difficulty);$('age').value=age;$('game').textContent=playing?'⏹ Стоп':'🎮 Игра';$('help').disabled=!playing||locked}function say(t){if(sound&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t));u.lang='ru-RU';u.rate=.88;speechSynthesis.speak(u)}}function show(t,h=''){$('display').textContent=t;$('hint').textContent=h}function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}function newTask(){clearTimeout(timer);locked=false;input='';let a,b,operation,limit=age==='3'?5:age==='5'?10:age==='7'?30:100;limit*=difficulty;let ops=age==='3'?['+','−']:age==='5'?['+','−']:age==='7'?['+','−','×']:['+','−','×','÷'];operation=ops[rand(0,ops.length-1)];a=rand(0,limit);b=rand(0,limit);if(operation==='−'&&a<b)[a,b]=[b,a];if(operation==='×'){let max=age==='7'?10:12*difficulty;a=rand(1,max);b=rand(1,max)}if(operation==='÷'){b=rand(1,12*difficulty);answer=rand(1,12*difficulty);a=b*answer}else answer=operation==='+'?a+b:operation==='−'?a-b:a*b;task={a,b,operation};show(`${a} ${operation} ${b} = ?`,'Введи ответ и нажми OK');$('status').textContent='За правильный ответ получишь ⭐';refresh();say(`Сколько будет ${a} ${{'+':'плюс','−':'минус','×':'умножить на','÷':'разделить на'}[operation]} ${b}?`)}function choose(o){if(playing)return;if(input==='')return;first=Number(input);op=o;input='';show(`${first} ${o}`,'Введи второе число')}function calculate(){if(first===null||input==='')return;let b=Number(input),v=op==='+'?first+b:op==='−'?first-b:op==='×'?first*b:b===0?null:first/b;if(v===null){show('Ошибка','На ноль делить нельзя');say('На ноль делить нельзя');input='';first=null;return}input=String(Math.round(v*10000)/10000);first=null;show(input,'Результат');say(input)}function submit(){if(!playing){calculate();return}if(locked||input==='')return;locked=true;progress.total++;if(Number(input)===answer){progress.correct++;progress.stars+=3;$('status').textContent='Верно! +3 ⭐';show('Молодец! ⭐','Правильный ответ');say('Молодец! Правильно!')}else{$('status').textContent=`Правильный ответ: ${answer}. +0 ⭐`;show(`${task.a} ${task.operation} ${task.b} = ${answer}`,'Ничего, следующий получится!');say(`Правильный ответ ${answer}`)}store();refresh();timer=setTimeout(()=>{if(playing)newTask()},1800)}document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>{if(locked||input.length>=10)return;input+=b.dataset.n;show(input,playing?`${task.a} ${task.operation} ${task.b} = ?`:'');say(b.dataset.n)}));document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>choose(b.dataset.op));$('plus').onclick=()=>choose('+');$('minus').onclick=()=>choose('−');$('game').onclick=()=>{playing=!playing;locked=false;clearTimeout(timer);input='';first=null;refresh();if(playing)newTask();else{show('0','Режим калькулятора');$('status').textContent='Игра остановлена'}};$('ok').onclick=submit;$('equals').onclick=submit;$('clear').onclick=()=>{if(locked)return;input=input.slice(0,-1);show(input||'0',playing?`${task.a} ${task.operation} ${task.b} = ?`:'')};$('help').onclick=()=>{if(!playing||locked)return;let t=task;let hint=t.operation==='+'?`Разбей ${t.b} на удобные части`:t.operation==='−'?`Отними ${t.b} по частям`:t.operation==='×'?`Вспомни таблицу умножения для ${t.a}`:`Подумай: какое число × ${t.b} = ${t.a}?`;$('status').textContent='💡 '+hint;say(hint)};$('sound').onclick=()=>{sound=!sound;if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel();$('sound').textContent=sound?'🔊 Звук':'🔇 Звук'};$('reset').onclick=()=>{if(!confirm('Сбросить звёзды и результаты для выбранного возраста и сложности?'))return;progress={stars:0,correct:0,total:0};store();refresh();$('status').textContent='Достижения сброшены'};function changeSettings(){clearTimeout(timer);locked=false;age=$('age').value;difficulty=Number($('difficulty').value);localStorage.setItem('rabbit-age',age);localStorage.setItem('rabbit-difficulty',difficulty);refresh();if(playing)newTask();else show('0','Настройки обновлены')} $('age').onchange=changeSettings;$('difficulty').onchange=changeSettings;document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9'){let b=document.querySelector(`[data-n="${e.key}"]`);b.click()}else if(e.key==='Enter')submit();else if(e.key==='Backspace')$('clear').click()});refresh();
</script></body></html>
